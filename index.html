<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>KMIE Attendance Scanner</title>
<script src="https://cdn.jsdelivr.net/npm/jsqr@1.4.0/dist/jsQR.js"></script>
<style>
body{font:17px system-ui,Arial,sans-serif;margin:0 auto;padding:16px;max-width:560px;color:#1d1d1f;background:#fff}
h1{font-size:22px;margin:4px 0 2px}
.muted{color:#555;font-size:14px}
button,input{font:inherit;padding:12px;margin:6px 0;width:100%;box-sizing:border-box;border-radius:8px;border:1px solid #bbb;background:#f4f4f4}
button.primary{background:#1a73e8;color:#fff;border-color:#1a73e8}
#msg{padding:16px;border-radius:10px;background:#eee;font-weight:700;margin:10px 0}
#msg.ok{background:#d4edda}#msg.bad{background:#f8d7da}
video{width:100%;border-radius:12px;background:#111;display:none}
#setup{display:none;border:1px solid #ddd;border-radius:10px;padding:12px;margin-top:8px}
#log{font-size:14px;padding-left:18px}
</style>
</head>
<body>
<h1>KMIE Attendance</h1>
<div class="muted" id="today">Connecting…</div>
<button class="primary" id="cam">Start camera</button>
<video id="video" playsinline muted></video>
<div id="msg">Tap "Start camera" and show a student QR card.</div>
<p class="muted">Backup: photo of the QR card</p>
<input id="photo" type="file" accept="image/*" capture="environment">
<p class="muted">Last scans</p>
<ol id="log"></ol>
<button id="showSetup">Station settings</button>
<div id="setup">
  <label class="muted">Attendance API link (ends in /exec)</label>
  <input id="apiIn" placeholder="https://script.google.com/macros/s/…/exec" autocomplete="off">
  <label class="muted">Station key</label>
  <input id="keyIn" placeholder="Station key" autocomplete="off">
  <button class="primary" id="saveSetup">Save and connect</button>
</div>
<canvas id="canvas" hidden></canvas>
<script>
const $=id=>document.getElementById(id);
const store={get(k){try{return localStorage.getItem(k)||''}catch(e){return ''}},set(k,v){try{localStorage.setItem(k,v)}catch(e){}}};
let API=store.get('kmie_api'),KEY=store.get('kmie_key');
let stream=null,scanning=false,busy=false,lastToken='',lastTime=0;

function say(t,c){$('msg').textContent=t;$('msg').className=c||'';}
function beep(ok){try{const a=new (window.AudioContext||window.webkitAudioContext)(),o=a.createOscillator();o.frequency.value=ok?880:220;o.connect(a.destination);o.start();o.stop(a.currentTime+0.15);}catch(e){}}
function buzz(ok){try{if(navigator.vibrate)navigator.vibrate(ok?80:[60,60,60]);}catch(e){}}

async function api(body){
  if(!API||!KEY)throw Error('Open Station settings and enter the link and key.');
  const r=await fetch(API,{method:'POST',headers:{'Content-Type':'text/plain;charset=utf-8'},body:JSON.stringify(Object.assign({key:KEY},body))});
  const j=await r.json();
  if(!j.ok)throw Error(j.message||'Failed');
  return j;
}
async function status(){
  try{const j=await api({action:'status'});$('today').textContent='Connected. Today: '+(j.sessions.join(', ')||'no classes scheduled');}
  catch(e){$('today').textContent='NOT CONNECTED: '+e.message;}
}
async function beat(){try{await api({action:'beat'});}catch(e){}}

function addLog(t,ok){
  const li=document.createElement('li');
  li.textContent=new Date().toLocaleTimeString('en-IN',{hour:'2-digit',minute:'2-digit'})+'  '+(ok?'':'✗ ')+t;
  $('log').prepend(li);
  while($('log').children.length>8)$('log').lastChild.remove();
}
async function save(token){
  if(busy)return;busy=true;say('Saving…');
  try{const j=await api({action:'scan',token});say(j.message,j.duplicate?'':'ok');beep(true);buzz(true);addLog(j.message,true);}
  catch(e){say('NOT SAVED: '+e.message,'bad');beep(false);buzz(false);addLog(e.message,false);}
  finally{busy=false;}
}

async function keepAwake(){try{if('wakeLock' in navigator)await navigator.wakeLock.request('screen');}catch(e){}}
document.addEventListener('visibilitychange',()=>{if(!document.hidden&&scanning)keepAwake();});

$('cam').onclick=async()=>{
  if(scanning){stopCam();return;}
  try{
    stream=await navigator.mediaDevices.getUserMedia({video:{facingMode:{ideal:'environment'}},audio:false});
    const v=$('video');v.srcObject=stream;v.style.display='block';await v.play();
    scanning=true;$('cam').textContent='Stop camera';keepAwake();beat();
    say('Camera ready. Show a QR card.','ok');loop();
  }catch(e){say('CAMERA ERROR: '+e.name+' – '+e.message,'bad');}
};
function stopCam(){scanning=false;if(stream)stream.getTracks().forEach(t=>t.stop());stream=null;$('video').style.display='none';$('cam').textContent='Start camera';say('Camera stopped.');}
function loop(){
  if(!scanning)return;
  const v=$('video');
  if(!busy&&v.readyState>=2&&v.videoWidth){
    const c=$('canvas'),sc=Math.min(1,640/v.videoWidth);
    c.width=Math.round(v.videoWidth*sc);c.height=Math.round(v.videoHeight*sc);
    const x=c.getContext('2d',{willReadFrequently:true});x.drawImage(v,0,0,c.width,c.height);
    const qr=jsQR(x.getImageData(0,0,c.width,c.height).data,c.width,c.height,{inversionAttempts:'dontInvert'});
    if(qr&&qr.data){const t=qr.data.trim(),now=Date.now();if(t&&(t!==lastToken||now-lastTime>5000)){lastToken=t;lastTime=now;save(t);}}
  }
  setTimeout(loop,250);
}

$('photo').onchange=async e=>{
  try{
    const f=e.target.files[0];if(!f)return;
    const img=new Image();img.src=URL.createObjectURL(f);await img.decode();
    const c=$('canvas'),sc=Math.min(1,1600/Math.max(img.width,img.height));
    c.width=Math.round(img.width*sc);c.height=Math.round(img.height*sc);
    const x=c.getContext('2d');x.drawImage(img,0,0,c.width,c.height);
    const qr=jsQR(x.getImageData(0,0,c.width,c.height).data,c.width,c.height);URL.revokeObjectURL(img.src);
    if(!qr)throw Error('No QR found; take a clear close-up photo.');
    save(qr.data.trim());
  }catch(err){say('NOT SAVED: '+err.message,'bad');}
  finally{e.target.value='';}
};

$('showSetup').onclick=()=>{const s=$('setup');s.style.display=s.style.display==='block'?'none':'block';$('apiIn').value=API;$('keyIn').value=KEY;};
$('saveSetup').onclick=()=>{API=$('apiIn').value.trim();KEY=$('keyIn').value.trim();store.set('kmie_api',API);store.set('kmie_key',KEY);$('setup').style.display='none';status();};

// Keep today's sessions alive while the page is open, so absentees can be finalised.
setInterval(()=>{if(!document.hidden)beat();},60000);

if(!API||!KEY){$('setup').style.display='block';$('today').textContent='First time: enter the link and key below.';}
else{status();beat();}
</script>
</body>
</html>
